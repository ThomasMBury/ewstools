version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.12"
    
sphinx:
  builder: html
  configuration: docs/source/conf.py
  fail_on_warning: true
  

# Declare the Python requirements required to build your docs
python:
   install:
   - requirements: docs/requirements.txt
   - method: pip
     path: .
     

formats:
  - pdf
  - epub


